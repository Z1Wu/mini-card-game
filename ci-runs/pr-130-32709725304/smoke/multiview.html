<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>完整牌局冒烟测试（跟随实际行动玩家）</title><style>
body{margin:0;background:#111827;color:#e5e7eb;font:14px system-ui,sans-serif}header{position:sticky;top:0;z-index:2;background:#0f172a;padding:12px 16px;border-bottom:1px solid #334155}h1{font-size:18px;margin:0 0 8px}.controls{display:flex;gap:8px;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:10px}.view{position:relative;border:3px solid #334155;border-radius:10px;overflow:hidden;background:#020617}.view.active{border-color:#f59e0b;box-shadow:0 0 0 2px #f59e0b55}.label{position:absolute;top:8px;left:8px;z-index:1;background:#020617cc;padding:4px 8px;border-radius:999px}.view.active .label{background:#b45309}video{display:block;width:100%;aspect-ratio:16/9;background:#000}.event{padding:0 16px 16px;color:#cbd5e1}input[type=range]{flex:1}
</style></head><body><header><h1>完整牌局冒烟测试（跟随实际行动玩家）</h1><div class="controls"><button id="toggle">播放</button><input id="time" type="range" min="0" step="0.05" value="0"><span id="clock">0.0s</span></div></header><main class="grid" id="grid"></main><p class="event" id="event">等待播放</p>
<script>const data={"title":"完整牌局冒烟测试（跟随实际行动玩家）","recording_started_at":1787562521651,"players":[{"name":"player1","username":"player1","offset_ms":0,"video":"player1.webm"},{"name":"player2","username":"player2","offset_ms":118,"video":"player2.webm"},{"name":"player3","username":"player3","offset_ms":259,"video":"player3.webm"}],"events":[{"at_ms":3219,"player_id":"player2","label":"完整牌局：玩家2 第 1 次行动"},{"at_ms":9447,"player_id":"player3","label":"完整牌局：玩家3 第 2 次行动"},{"at_ms":11426,"player_id":"player1","label":"完整牌局：玩家1 第 3 次行动"},{"at_ms":13475,"player_id":"player2","label":"完整牌局：玩家2 第 4 次行动"},{"at_ms":15809,"player_id":"player3","label":"完整牌局：玩家3 第 5 次行动"},{"at_ms":17543,"player_id":"player1","label":"完整牌局：玩家1 第 6 次行动"},{"at_ms":19206,"player_id":"player2","label":"完整牌局：玩家2 第 7 次行动"},{"at_ms":20890,"player_id":"player3","label":"完整牌局：玩家3 第 8 次行动"},{"at_ms":22636,"player_id":"player1","label":"完整牌局：玩家1 第 9 次行动"},{"at_ms":24441,"player_id":"player2","label":"完整牌局：玩家2 第 10 次行动"},{"at_ms":26055,"player_id":"player3","label":"完整牌局：玩家3 第 11 次行动"},{"at_ms":27763,"player_id":"player1","label":"完整牌局：玩家1 第 12 次行动"},{"at_ms":29441,"player_id":"player2","label":"完整牌局：玩家2 第 13 次行动"},{"at_ms":31113,"player_id":"player3","label":"完整牌局：玩家3 第 14 次行动"},{"at_ms":32793,"player_id":"player1","label":"完整牌局：玩家1 第 15 次行动"}]};const grid=document.querySelector('#grid');const videos=[];for(const player of data.players){const box=document.createElement('section');box.className='view';box.dataset.player=player.username;box.innerHTML='<span class="label"></span><video muted playsinline preload="metadata"></video>';box.querySelector('.label').textContent=player.name+' / '+player.username;const video=box.querySelector('video');video.src=player.video;grid.append(box);videos.push({video,box,offset:player.offset_ms/1000});}const range=document.querySelector('#time');const clock=document.querySelector('#clock');const eventText=document.querySelector('#event');let playing=false,start=0,origin=0,max=0;Promise.all(videos.map(({video,offset})=>new Promise(resolve=>{video.addEventListener('loadedmetadata',()=>{max=Math.max(max,video.duration+offset);resolve();},{once:true})}))).then(()=>range.max=max);function seek(t){range.value=t;clock.textContent=t.toFixed(1)+'s';for(const item of videos){const local=Math.max(0,t-item.offset);if(Math.abs(item.video.currentTime-local)>.18)item.video.currentTime=Math.min(local,item.video.duration||local);}const current=[...data.events].reverse().find(entry=>entry.at_ms/1000<=t);for(const item of videos)item.box.classList.toggle('active',item.box.dataset.player===current?.player_id);eventText.textContent=current?current.label:'等待场景开始';}function frame(now){if(!playing)return;const t=origin+(now-start)/1000;if(t>=max){playing=false;document.querySelector('#toggle').textContent='播放';seek(max);return}seek(t);requestAnimationFrame(frame)}document.querySelector('#toggle').onclick=()=>{playing=!playing;if(playing){start=performance.now();origin=Number(range.value);document.querySelector('#toggle').textContent='暂停';for(const {video} of videos)video.play().catch(()=>{});requestAnimationFrame(frame)}else{document.querySelector('#toggle').textContent='播放';for(const {video} of videos)video.pause();}};range.oninput=()=>seek(Number(range.value));seek(0);</script></body></html>
