</style></head><body><header><h1>确定性玩法场景（多视角）</h1><div class="controls"><button id="toggle">播放</button><input id="time" type="range" min="0" step="0.05" value="0"><span id="clock">0.0s</span></div></header><main class="grid" id="grid"></main><p class="event" id="event">等待播放</p>
<script>const data={"title":"确定性玩法场景（多视角）","recording_started_at":1787364221814,"players":[{"name":"player1","username":"player1","offset_ms":0,"video":"player1.webm"},{"name":"player2","username":"player2","offset_ms":115,"video":"player2.webm"},{"name":"player3","username":"player3","offset_ms":239,"video":"player3.webm"},{"name":"player4","username":"player4","offset_ms":406,"video":"player4.webm"}],"events":[{"at_ms":2184,"player_id":"player1","label":"1/12 · 调和与隐藏归属"},{"at_ms":4937,"player_id":"player1","label":"2/12 · 质疑与目标归属"},{"at_ms":8050,"player_id":"player1","label":"3/12 · 图书委员查看调和区"},{"at_ms":13115,"player_id":"player1","label":"4/12 · 归宅部交换隐藏调和牌"},{"at_ms":16577,"player_id":"player1","label":"5/12 · 保健委员收回公开场牌"},{"at_ms":19685,"player_id":"player1","label":"6/12 · 风纪委员私下查看手牌"},{"at_ms":24809,"player_id":"player1","label":"7/12 · 新闻部逐人传牌"},{"at_ms":26788,"player_id":"player1","label":"新闻部传牌 · player1 正在选择"},{"at_ms":27465,"player_id":"player2","label":"新闻部传牌 · player2 正在选择"},{"at_ms":28182,"player_id":"player3","label":"新闻部传牌 · player3 正在选择"},{"at_ms":28879,"player_id":"player4","label":"新闻部传牌 · player4 正在选择"},{"at_ms":29719,"player_id":"player1","label":"8/12 · 大小姐两阶段交换"},{"at_ms":36108,"player_id":"player1","label":"9/12 · 共犯移动质疑牌"},{"at_ms":39541,"player_id":"player1","label":"10/12 · 感染者下回合拿牌"},{"at_ms":41354,"player_id":"player2","label":"感染者等待下回合 · player2 调和"},{"at_ms":43096,"player_id":"player3","label":"感染者等待下回合 · player3 调和"},{"at_ms":44706,"player_id":"player4","label":"感染者等待下回合 · player4 调和"},{"at_ms":47570,"player_id":"player1","label":"11/12 · 班长双方选牌交换"},{"at_ms":54507,"player_id":"player1","label":"12/12 · 优等生等待举手与结果"}]};const grid=document.querySelector('#grid');const videos=[];for(const player of data.players){const box=document.createElement('section');box.className='view';box.dataset.player=player.username;box.innerHTML='<span class="label"></span><video muted playsinline preload="metadata"></video>';box.querySelector('.label').textContent=player.name+' / '+player.username;const video=box.querySelector('video');video.src=player.video;grid.append(box);videos.push({video,box,offset:player.offset_ms/1000});}const range=document.querySelector('#time');const clock=document.querySelector('#clock');const eventText=document.querySelector('#event');let playing=false,start=0,origin=0,max=0;Promise.all(videos.map(({video,offset})=>new Promise(resolve=>{video.addEventListener('loadedmetadata',()=>{max=Math.max(max,video.duration+offset);resolve();},{once:true})}))).then(()=>range.max=max);function seek(t){range.value=t;clock.textContent=t.toFixed(1)+'s';for(const item of videos){const local=Math.max(0,t-item.offset);if(Math.abs(item.video.currentTime-local)>.18)item.video.currentTime=Math.min(local,item.video.duration||local);}const current=[...data.events].reverse().find(entry=>entry.at_ms/1000<=t);for(const item of videos)item.box.classList.toggle('active',item.box.dataset.player===current?.player_id);eventText.textContent=current?current.label:'等待场景开始';}function frame(now){if(!playing)return;const t=origin+(now-start)/1000;if(t>=max){playing=false;document.querySelector('#toggle').textContent='播放';seek(max);return}seek(t);requestAnimationFrame(frame)}document.querySelector('#toggle').onclick=()=>{playing=!playing;if(playing){start=performance.now();origin=Number(range.value);document.querySelector('#toggle').textContent='暂停';for(const {video} of videos)video.play().catch(()=>{});requestAnimationFrame(frame)}else{document.querySelector('#toggle').textContent='播放';for(const {video} of videos)video.pause();}};range.oninput=()=>seek(Number(range.value));seek(0);</script></body></html>
