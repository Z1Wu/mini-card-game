# 服务器部署：从 Docker Hub 拉取 CI 构建的前端 + 后端 + Nginx 单镜像
# 使用: IMAGE_TAG=v1.0.8 ./deploy.sh（不指定 IMAGE_TAG 时使用 latest）

services:
  app:
    image: "${CARD_GAME_IMAGE:-z1wu97/mini-card-game}:${IMAGE_TAG:-latest}"
    container_name: card-game
    ports:
      - "80:80"
    restart: unless-stopped
    # 挂载自定义登录用户配置时取消下面注释，并创建 deploy-data/users.json（可复制 deploy-data/users.json.example 后修改）
    # volumes:
    #   - ./deploy-data/users.json:/app/backend/auth/users.json:ro
