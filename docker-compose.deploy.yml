# 服务器部署：从 Docker Hub 拉取 CI 构建的前端 + 后端 + Nginx 单镜像
# 使用: IMAGE_TAG=v1.0.8 ./deploy.sh（不指定 IMAGE_TAG 时使用 latest）

services:
  app:
    image: "${CARD_GAME_IMAGE:-z1wu97/mini-card-game}:${IMAGE_TAG:-latest}"
    container_name: card-game
    ports:
      - "80:80"
    restart: unless-stopped
    environment:
      APP_ENV: production
      AUTH_USERS_FILE: /app/config/users.json
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS to the public HTTP(S) origin before deploying}
    volumes:
      - ./deploy-data/users.json:/app/config/users.json:ro
