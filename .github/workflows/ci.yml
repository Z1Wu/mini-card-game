# CI：每次 push / PR 时运行后端单元测试与前端构建、lint
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install backend dependencies and run tests
        working-directory: backend
        run: |
          uv sync --frozen
          uv run pytest tests/ -v --tb=short

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Component tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs: [backend]
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run recorded three-player game
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload browser E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-e2e-artifacts
          path: |
            frontend/test-results/full-game/
            frontend/test-results/scenarios/
          if-no-files-found: error
          retention-days: 14

      - name: Publish synchronized multiviews to GitHub Pages
        id: publish-e2e
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"
          OWNER="${{ github.repository_owner }}"
          REPO_NAME="${REPO##*/}"
          TARGET="pr-${PR_NUMBER}-${RUN_ID}"

          if [ ! -f "frontend/test-results/full-game/multiview.html" ] || \
             [ ! -f "frontend/test-results/scenarios/multiview.html" ]; then
            echo "Multiview artifacts are incomplete; skipping publish."
            echo "smoke_url=" >> "$GITHUB_OUTPUT"
            echo "scenarios_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STAGING=$(mktemp -d)
          if ! git clone --depth=1 --branch=gh-pages \
               "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
               "$STAGING"; then
            echo "gh-pages branch not available; skipping publish."
            echo "smoke_url=" >> "$GITHUB_OUTPUT"
            echo "scenarios_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p "$STAGING/ci-runs/$TARGET/smoke" "$STAGING/ci-runs/$TARGET/scenarios"
          cp frontend/test-results/full-game/{multiview.html,timeline.json,player*.webm} "$STAGING/ci-runs/$TARGET/smoke/"
          cp frontend/test-results/scenarios/{multiview.html,timeline.json,player*.webm} "$STAGING/ci-runs/$TARGET/scenarios/"

          cd "$STAGING/ci-runs"
          find . -mindepth 1 -maxdepth 1 -type d -name 'pr-*' ! -name '*-mobile' -printf '%f\n' \
            | sort -t- -k3 -rn | tail -n +11 | xargs -r rm -rf
          cd "$STAGING"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "ci: E2E multiviews for PR #${PR_NUMBER} (run ${RUN_ID})"
            if ! git push; then
              echo "Push to gh-pages failed; skipping embed."
              echo "smoke_url=" >> "$GITHUB_OUTPUT"
              echo "scenarios_url=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          BASE_URL="https://${OWNER}.github.io/${REPO_NAME}/ci-runs/${TARGET}"
          echo "smoke_url=${BASE_URL}/smoke/multiview.html" >> "$GITHUB_OUTPUT"
          echo "scenarios_url=${BASE_URL}/scenarios/multiview.html" >> "$GITHUB_OUTPUT"

      - name: Build PR comment from report
        if: always() && github.event_name == 'pull_request'
        working-directory: frontend
        env:
          MULTIVIEW_URL: ${{ steps.publish-e2e.outputs.smoke_url }}
        run: node e2e/build-pr-comment.mjs

      - name: Post e2e result to PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: e2e-result
          path: frontend/test-results/full-game/pr-comment.md

      - name: Build deterministic scenario PR comment
        if: always() && github.event_name == 'pull_request'
        working-directory: frontend
        env:
          MULTIVIEW_URL: ${{ steps.publish-e2e.outputs.scenarios_url }}
          E2E_REPORT_PATH: test-results/scenarios/report.json
          E2E_COMMENT_PATH: test-results/scenarios/pr-comment.md
          E2E_TITLE_PREFIX: "🎯 Deterministic scenarios"
        run: node e2e/build-pr-comment.mjs

      - name: Post deterministic scenario result to PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: e2e-scenarios-result
          path: frontend/test-results/scenarios/pr-comment.md

      - name: Run mobile game (844x390 landscape)
        if: always()
        working-directory: frontend
        run: npm run test:e2e:mobile

      - name: Upload mobile E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mobile-e2e-artifacts
          path: frontend/test-results/mobile-game/
          if-no-files-found: error
          retention-days: 14

      - name: Publish mobile multiview to GitHub Pages
        id: publish-mobile-webm
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"
          OWNER="${{ github.repository_owner }}"
          REPO_NAME="${REPO##*/}"
          TARGET="pr-${PR_NUMBER}-${RUN_ID}-mobile"

          if [ ! -f "frontend/test-results/mobile-game/multiview.html" ]; then
            echo "No mobile multiview produced; skipping publish."
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STAGING=$(mktemp -d)
          if ! git clone --depth=1 --branch=gh-pages \
               "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
               "$STAGING"; then
            echo "gh-pages branch not available; skipping publish."
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p "$STAGING/ci-runs/$TARGET"
          cp frontend/test-results/mobile-game/{multiview.html,timeline.json,player*.webm} "$STAGING/ci-runs/$TARGET/"

          cd "$STAGING/ci-runs"
          find . -mindepth 1 -maxdepth 1 -type d -name 'pr-*-mobile' -printf '%f\n' \
            | sort -t- -k3 -rn | tail -n +11 | xargs -r rm -rf
          cd "$STAGING"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "ci: mobile E2E multiview for PR #${PR_NUMBER} (run ${RUN_ID})"
            if ! git push; then
              echo "Push to gh-pages failed; skipping embed."
              echo "url=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          URL="https://${OWNER}.github.io/${REPO_NAME}/ci-runs/${TARGET}/multiview.html"
          echo "Published mobile multiview: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build mobile PR comment from report
        if: always() && github.event_name == 'pull_request'
        working-directory: frontend
        env:
          MULTIVIEW_URL: ${{ steps.publish-mobile-webm.outputs.url }}
          E2E_REPORT_PATH: test-results/mobile-game/report.json
          E2E_COMMENT_PATH: test-results/mobile-game/pr-comment.md
          E2E_TITLE_PREFIX: "📱 Mobile"
        run: node e2e/build-pr-comment.mjs

      - name: Post mobile e2e result to PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: mobile-e2e-result
          path: frontend/test-results/mobile-game/pr-comment.md
