# CI：每次 push / PR 时运行后端单元测试与前端构建、lint
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install backend dependencies and run tests
        working-directory: backend
        run: |
          uv sync --frozen
          uv run pytest tests/ -v --tb=short

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Component tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run recorded three-player game
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload browser E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-e2e-artifacts
          path: frontend/test-results/full-game/
          if-no-files-found: error
          retention-days: 14

      - name: Build PR comment from report
        if: always() && github.event_name == 'pull_request'
        working-directory: frontend
        run: node e2e/build-pr-comment.mjs

      - name: Post e2e result to PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: e2e-result
          path: frontend/test-results/full-game/pr-comment.md
